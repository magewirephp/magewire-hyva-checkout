name: 'Release Please'

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT lets bot-created release PRs trigger the regular checks. The
          # built-in token keeps releases operational until MY_TOKEN is added.
          token: ${{ secrets.MY_TOKEN || github.token }}
