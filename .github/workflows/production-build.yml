name: 'Production build'

# Verifies the module survives the same production compile a real Magento deploy runs.
#
# Required repository secrets:
#   HYVA_COMPOSER_REPO_URL    Hyva Private Packagist repository URL
#   HYVA_COMPOSER_AUTH_TOKEN  Password for the repository's `token` user

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  production-build:
    name: '${{ matrix.distribution }} ${{ matrix.version }} / PHP ${{ matrix.php }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Cover each supported Magento release line while spanning PHP 8.2-8.5.
          - distribution: 'Magento Open Source'
            project: 'magento/project-community-edition'
            repository: 'https://mirror.mage-os.org/'
            version: '2.4.6-p15'
            php: '8.2'
          - distribution: 'Magento Open Source'
            project: 'magento/project-community-edition'
            repository: 'https://mirror.mage-os.org/'
            version: '2.4.7-p10'
            php: '8.3'
          - distribution: 'Magento Open Source'
            project: 'magento/project-community-edition'
            repository: 'https://mirror.mage-os.org/'
            version: '2.4.8-p5'
            php: '8.4'
          - distribution: 'Magento Open Source'
            project: 'magento/project-community-edition'
            repository: 'https://mirror.mage-os.org/'
            version: '2.4.9'
            php: '8.5'

          # Cover the latest release in every supported Mage-OS major line.
          - distribution: 'Mage-OS'
            project: 'mage-os/project-community-edition'
            repository: 'https://repo.mage-os.org/'
            version: '1.3.1'
            php: '8.2'
          - distribution: 'Mage-OS'
            project: 'mage-os/project-community-edition'
            repository: 'https://repo.mage-os.org/'
            version: '2.3.0'
            php: '8.4'
          - distribution: 'Mage-OS'
            project: 'mage-os/project-community-edition'
            repository: 'https://repo.mage-os.org/'
            version: '3.2.0'
            php: '8.5'

    env:
      MAGENTO_DIR: ${{ github.workspace }}/magento
      MODULE_DIR: ${{ github.workspace }}/module-src
      COMPOSER_MEMORY_LIMIT: '-1'

    steps:
      - name: Verify Hyva license secrets are present
        run: |
          if [ -z "${{ secrets.HYVA_COMPOSER_REPO_URL }}" ] || [ -z "${{ secrets.HYVA_COMPOSER_AUTH_TOKEN }}" ]; then
            echo "::error::HYVA_COMPOSER_REPO_URL and HYVA_COMPOSER_AUTH_TOKEN are required."
            exit 1
          fi

      - name: Checkout module (the PR code)
        uses: actions/checkout@v7
        with:
          path: module-src

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, gd, hash, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sockets, xsl, zip, fileinfo
          tools: composer:v2
          ini-values: memory_limit=-1
        env:
          COMPOSER_TOKEN: ${{ github.token }}

      - name: Create ${{ matrix.distribution }} project
        run: |
          composer create-project \
            --repository-url="${{ matrix.repository }}" \
            --no-install \
            "${{ matrix.project }}:${{ matrix.version }}" \
            "$MAGENTO_DIR"

      - name: Configure Composer repositories and auth
        working-directory: ${{ env.MAGENTO_DIR }}
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config allow-plugins.mage-os/composer-dependency-version-audit-plugin false
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin false

          composer config repositories.module-src \
            "{\"type\":\"path\",\"url\":\"$MODULE_DIR\",\"options\":{\"symlink\":false}}"
          composer config repositories.magewire vcs https://github.com/magewirephp/magewire.git
          composer config repositories.hyva composer '${{ secrets.HYVA_COMPOSER_REPO_URL }}'
          composer config --global --auth \
            http-basic.hyva-themes.repo.packagist.com token '${{ secrets.HYVA_COMPOSER_AUTH_TOKEN }}'

          # A detached checkout has no usable Composer version. This high 3.x version
          # satisfies package constraints without colliding with a published release.
          composer --working-dir="$MODULE_DIR" config version 3.999.0

      - name: Install distribution and module (production dependencies only)
        working-directory: ${{ env.MAGENTO_DIR }}
        run: |
          composer install --no-dev --no-interaction --no-progress
          composer require --no-update --no-interaction \
            "magewirephp/magewire-hyva-checkout:3.999.0" \
            "magewirephp/magewire:dev-main as 3.3.1"
          composer update --no-dev --no-interaction --no-progress -W

      - name: Enable all modules
        working-directory: ${{ env.MAGENTO_DIR }}
        run: |
          php bin/magento module:enable --all --no-interaction
          php bin/magento module:status Magewirephp_MagewireHyvaCheckout

      - name: setup:di:compile
        working-directory: ${{ env.MAGENTO_DIR }}
        run: php bin/magento setup:di:compile --no-interaction
